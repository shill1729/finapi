[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finapi"
version = "0.1.5"
description = "Wrappers for Alpha Vantage, Finnhub, and Robinhood Crypto APIs"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.34",
    "pandas>=3.1",
    "PyNaCl>=1.6.2",
    "finnhub-python>=2.4.25",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["finapi*"]
